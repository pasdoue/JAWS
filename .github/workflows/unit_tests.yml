name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PDM
        run: |
          python -m pip install --upgrade pip
          pip install pdm
      - name: Install dependencies
        run: |
          pdm sync -d -G dev
      - name: Run tests
        run: |
          pdm run pytest -v -s