[build-system]
requires = ["setuptools", "wheel", "attrs"]
build-backend = "setuptools.build_meta"

[project]
name = "JAWS"
authors = [
  {name = "pasdoue", email = "pasdoue@protonmail.com"},
]
maintainers = [
  {name = "pasdoue", email = "pasdoue@protonmail.com"}
]

description = "AWS IAM bruteforcer"
readme = "README.md"
keywords = ["AWS", "IAM", "bruteforce"]
dependencies = [
    "R2Log~=1.0.2",
    "boto3~=1.43.14",
    "botocore~=1.43.14",
    "requests~=2.34.2",
    "aiobotocore~=3.7.0",
]
dynamic = ["version"]
requires-python = ">= 3.10"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
